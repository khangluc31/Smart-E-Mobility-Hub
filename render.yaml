# Exactly one backend instance (D-02). Don't scale horizontally.
# Background jobs (telemetry generator, reservation expiry, charging scheduler)
# run inside the backend process. Multiple instances would run each job multiple times.

services:
  - type: web
    name: smart-emobility-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: emobility-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TELEMETRY_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: JOBS_ENABLED
        value: 'true'
      - key: DEMO_TIME_SCALE
        value: '1'

databases:
  - name: emobility-db
    plan: free
    databaseName: emobility
