name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emobility_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emobility_test
      CORS_ORIGIN: http://localhost:5173
      JOBS_ENABLED: 'false'
      JWT_SECRET: ci-test-secret
      TELEMETRY_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Prisma client
        run: npm run db:generate -w backend

      - name: Apply migrations (test DB)
        run: npm run db:deploy -w backend

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check circular imports
        run: npm run check:cycles
